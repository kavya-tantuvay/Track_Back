name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · build + e2e smoke (Postgres + pgvector)
    runs-on: ubuntu-latest

    # Real Postgres with the pgvector extension, matching production (Neon).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trackback
          POSTGRES_PASSWORD: trackback
          POSTGRES_DB: trackback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackback -d trackback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://trackback:trackback@localhost:5432/trackback
      JWT_SECRET: ci-test-secret
      EMBEDDER: fallback # deterministic, no model download in CI

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations (tables + pgvector extension + HNSW index)
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: End-to-end smoke test (API + pgvector matching)
        run: npm run smoke

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
